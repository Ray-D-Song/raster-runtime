name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' raster_runtime/Cargo.toml)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME must equal v$version" >&2
            exit 1
          }

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: raster_runtime-linux-x64
            platform: linux
            arch: x64
            zig: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: raster_runtime-linux-arm64
            platform: linux
            arch: arm64
            zig: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: raster_runtime-macos-x64
            platform: darwin
            arch: x64
            zig: false
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: raster_runtime-macos-arm64
            platform: darwin
            arch: arm64
            zig: false
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: raster_runtime-windows-x64.exe
            platform: win32
            arch: x64
            zig: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: raster_runtime-windows-arm64.exe
            platform: win32
            arch: arm64
            zig: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch zstd source
        run: git submodule update --init zstd
      - uses: actions/setup-node@v4
        with:
          node-version: 24.3.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.zig
      - run: make js
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify binary and stage release asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/raster_runtime${{ endsWith(matrix.asset, '.exe') && '.exe' || '' }}" "${{ matrix.asset }}"
          expected="raster_runtime v${GITHUB_REF_NAME#v} (${{ matrix.platform }}, ${{ matrix.arch }})"
          test "$(./${{ matrix.asset }} --version)" = "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd release
          sha256sum raster_runtime-* > SHA256SUMS
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease+=(--prerelease)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" raster_runtime-* SHA256SUMS --clobber
